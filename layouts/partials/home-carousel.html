<section class="carousel-container">
  <div class="swiper">
      <div class="swiper-wrapper">
          <div class="swiper-slide">
              <a href="https://meetings.cshl.edu/meetingsregistrationgeneral.aspx?meet=galaxy&year=25" target="_blank" class="carousel-link">
                  <img src="/img/carousel/home/registration_open.svg" alt="Registration Open">
              </a>
          </div>
          <div class="swiper-slide">
              <a href="{{ "about/venue/" | relURL }}" class="carousel-link">
                  <img src="/img/carousel/home/discover_harbor.svg" alt="Learn about Cold Spring Harbor">
              </a>
          </div>
      </div>
  </div>
</section>

  <!-- Swiper CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      new Swiper(".swiper", {
        loop: true,
        autoplay: {
          delay: 5000,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        /* Add navigation or other options as needed */
      });
    });
  </script>
  
  <style>
/* 1. Container: Full width, fixed height */
.carousel-container {
    width: 100vw;      /* Full browser width */
    height: 60vh;      /* Fixed 60% of viewport height */
    overflow: hidden;  /* Prevents content overflow */
}

/* 2. Swiper: Full container width & height */
.swiper {
    width: 100%;
    height: 100%;
}

/* 3. Each slide as a flex container to center content */
.swiper-slide {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative; /* Needed to make links fill the slide */
}

/* 4. Clickable Link Container */
.carousel-link {
    display: block;  /* Makes <a> fill the slide */
    width: 100%;
    height: 100%;
    position: absolute; /* Ensures full coverage of the slide */
    top: 0;
    left: 0;
}

/* 5. Images: Fill container and stay properly scaled */
.carousel-link img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ensures images fill their space */
    object-position: center; /* Keeps image centered */
    pointer-events: none; /* Prevents interference with link clicking */
}

  </style>
