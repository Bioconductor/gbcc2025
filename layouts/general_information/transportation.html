<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
  {{ partial "head.html" . }}

  <body>
    <div id="all">
      {{ partial "top.html" . }}
      {{ partial "nav.html" . }}

      <!-- A hero/intro block for the Transportation Page -->
      <section class="transportation-hero">
        <div class="hero-overlay">
          <h1>Getting to the Conference</h1>
          <p class="hero-subtitle">Planes, Trains, & Automobiles</p>
        </div>
      </section>

      <!-- Main content area -->
      <div class="transportation-content">
        <!-- This is where the Markdown content from `transportation.md` goes -->
        {{ .Content }}
      </div>

      {{ partial "footer.html" . }}
    </div>

    {{ partial "scripts.html" . }}
    {{ partial "custom-scripts.html" . }}

    <!-- Inline or external CSS for the transportation page -->
    <style>
    :root {
      --deep-navy:   #1B3A4B;
      --forest-green:#2E5636;
      --soft-beige:  #F5F1E3;
      --sky-blue:    #6C91C2;
      --dark-gray:   #3A3A3A;
      --white:       #FFFFFF;
    }

    /**************************************
     * HERO SECTION
     **************************************/
    .transportation-hero {
      position: relative;
      height: 50vh;
      background: var(--deep-navy) url('/img/transportation/map-nyc-cshl.svg') no-repeat center center;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      text-align: center;
    }
    /* If you don't have a hero image, you can simply use a gradient or solid color. */

    .hero-overlay {
      background: rgba(0,0,0,0.4);
      padding: 2rem;
      border-radius: 8px;
    }

    .hero-overlay h1 {
      font-size: 2.5rem;
      margin: 0 0 0.5rem;
      font-weight: 700;
    }

    .hero-subtitle {
      font-size: 1.3rem;
      margin: 0;
      font-style: italic;
    }

    /**************************************
     * MAIN CONTENT AREA
     **************************************/
    .transportation-content {
      max-width: 1100px;
      margin: -3rem auto 2rem; /* pull up slightly into hero overlay */
      background-color: var(--white);
      padding: 2rem;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: relative;
      z-index: 2;
    }

    .transportation-content h2 {
      color: var(--forest-green);
      margin-top: 2rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--forest-green);
      padding-bottom: 0.4rem;
    }

    /* For subheadings that might need sky-blue or dark-gray color */
    .transportation-content h3 {
      color: var(--sky-blue);
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .transportation-content p,
    .transportation-content li {
      color: var(--dark-gray);
      line-height: 1.6;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    /* Example for stylized callout boxes */
    .callout-box {
      background-color: var(--soft-beige);
      border-left: 4px solid var(--forest-green);
      padding: 1rem;
      margin: 1.5rem 0;
      border-radius: 4px;
    }

    .callout-box strong {
      color: var(--deep-navy);
    }

    /* Stylized link colors */
    .transportation-content a {
      color: var(--sky-blue);
      text-decoration: none;
    }

    .transportation-content a:hover {
      text-decoration: underline;
    }

    /* Horizontal rule styling */
    .transportation-content hr {
      border: none;
      border-top: 1px solid var(--forest-green);
      margin: 2rem 0;
    }

    /* Example: Hotel cards in a grid */
    .hotel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .hotel-card {
      background-color: var(--soft-beige);
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 1rem;
    }
    .hotel-card h4 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: var(--deep-navy);
    }

    /* Responsive tweaks if needed */
    @media (max-width: 768px) {
      .transportation-hero {
        height: 40vh;
      }
      .hero-overlay h1 {
        font-size: 2rem;
      }
      .transportation-content {
        margin: -2rem auto 1rem;
        padding: 1rem;
      }
    }
    </style>
  </body>
</html>
