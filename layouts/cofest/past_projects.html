<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
  {{ partial "head.html" . }}
  <body>
    <div id="all">
      {{ partial "top.html" . }}
      {{ partial "nav.html" . }}

      <!-- Main Content -->
      <main id="coming-soon-page" class="container">
        <header class="page-header">
          <h1>🚀 Something Exciting is Coming Soon!</h1>
          <p>We're working hard to bring you something amazing. Stay tuned!</p>
        </header>

      </main>

      {{ partial "footer.html" . }}
    </div>

    {{ partial "scripts.html" . }}
    {{ partial "custom-scripts.html" . }}

  </body>
</html>

<style>
    /* General Page Styling */
body {
  font-family: Arial, sans-serif;
  line-height: 1.6;
  text-align: center;
}

#coming-soon-page {
  padding: 20px;
  background-color: #f5f1e3; /* Light beige background */
}

/* Header Section */
.page-header {
  background-color: #1b3a4b; /* Deep navy */
  color: white;
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 40px;
}

.page-header h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

/* Responsive Adjustments */
@media (max-width: 768px) {
  .stay-updated form {
    flex-direction: column;
  }
}

</style>
